name: XiaokeVideo
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10000"
targets:
  XiaokeVideo:
    type: application
    platform: iOS
    sources:
      - path: XiaokeVideo
      - path: Shared
      - path: web            # 和線上版、Windows 版同一份剪輯程式（sync.sh 複製進來），整個資料夾放進 App
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokevideo
        TARGETED_DEVICE_FAMILY: "2"       # iPad（含 iPad Pro）；Mac 版是下面的 XiaokeVideoMac
        SUPPORTS_MACCATALYST: NO          # Catalyst 的網頁引擎沒有 MediaRecorder，不能匯出影片 → Mac 版用原生 macOS App
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program（個人）
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
    info:
      path: XiaokeVideo/Info.plist
      properties:
        CFBundleDisplayName: 小柯影音剪輯
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIUserInterfaceStyle: Dark
        # iPadOS 26 起 App 視窗可以自由調整大小、直放橫放都要支援（剪輯畫面會依寬度自動調整）
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 「選擇檔案…」可以直接拍攝影片、儲存匯出的影片到「照片」
        NSCameraUsageDescription: 匯入素材時可以直接拍照或錄影，放進剪輯時間軸。
        NSMicrophoneUsageDescription: 匯入素材時直接錄影，需要同時錄下聲音。
        NSPhotoLibraryAddUsageDescription: 把匯出的影片儲存到「照片」。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
  XiaokeVideoMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: web
        type: folder
    settings:
      base:
        PRODUCT_NAME: 小柯影音剪輯助手      # 「應用程式」資料夾裡顯示的名稱
        PRODUCT_MODULE_NAME: XiaokeVideoMac
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.xiaokevideo   # 和 iPad 版同一個 Bundle ID：App Store 同一個項目
        ARCHS: "$(ARCHS_STANDARD)"         # Apple 晶片（arm64）＋ Intel（x86_64）
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP
        CODE_SIGN_ENTITLEMENTS: Mac/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: 小柯影音剪輯助手
        CFBundleName: 小柯影音剪輯助手
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: © 2026 YU-JUH WU
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  XiaokeVideo:
    build:
      targets:
        XiaokeVideo: all
    run:
      config: Debug
    archive:
      config: Release
  XiaokeVideoMac:
    build:
      targets:
        XiaokeVideoMac: all
    run:
      config: Debug
    archive:
      config: Release
